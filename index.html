<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>أسعار العون</title>
<meta name="theme-color" content="#0f2a4a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="fonts/cairo.css">
<style>
  :root{
    --navy:#0f2a4a; --navy-2:#173b66; --ink:#0f172a; --muted:#5b6472; --line:#e3e7ee;
    --bg:#f3f5f9; --card:#ffffff; --ok:#16a34a; --warn:#b45309; --bad:#b91c1c;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{font-family:'Cairo',system-ui,sans-serif;background:var(--bg);color:var(--ink);
       -webkit-tap-highlight-color:transparent;overscroll-behavior:none}
  button{font-family:inherit}
  .num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
  .hidden{display:none!important}

  /* setup */
  #setup{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;gap:14px;
         background:var(--navy);color:#fff;text-align:center}
  #setup img{width:84px;height:84px;border-radius:18px}
  #setup h1{margin:0;font-size:26px}
  #setup p{margin:0;opacity:.85;font-size:16px}
  #setup input{width:min(320px,100%);font-size:28px;text-align:center;padding:12px;border-radius:12px;border:0;letter-spacing:4px;font-family:inherit}
  #setup .btn{width:min(320px,100%);flex:none}
  #setupMsg{min-height:24px;color:#fecaca;font-weight:600}

  /* app */
  #app{height:100%;display:flex;flex-direction:column}
  header{background:var(--navy);color:#fff;padding:8px 14px calc(8px) 14px;display:flex;align-items:center;gap:10px;
         padding-top:calc(8px + env(safe-area-inset-top))}
  header .title{font-weight:700;font-size:18px;flex:1;white-space:nowrap}
  header .status{font-size:12px;opacity:.85;text-align:left;line-height:1.3}
  header .status.warn{color:#fde68a;opacity:1}
  .iconbtn{background:transparent;border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:10px;min-width:44px;height:40px;font-size:18px}

  #cam{position:relative;background:#000;height:38vh;min-height:220px;overflow:hidden;flex:none}
  #cam video{width:100%;height:100%;object-fit:cover;display:block}
  #shade{position:absolute;inset:0;pointer-events:none}
  #win{position:absolute;left:6%;right:6%;top:31%;bottom:31%;border:3px solid rgba(255,255,255,.9);border-radius:12px;
       box-shadow:0 0 0 2000px rgba(0,0,0,.45);transition:border-color .15s}
  #win::after{content:"";position:absolute;left:4%;right:4%;top:50%;height:2px;background:rgba(239,68,68,.85)}
  #win.hit{border-color:#22c55e}
  #win.hit::before{content:"✓";position:absolute;top:-34px;left:50%;transform:translateX(-50%);background:#16a34a;color:#fff;
       border-radius:999px;width:30px;height:30px;display:flex;align-items:center;justify-content:center;font-weight:700}
  #hint{position:absolute;bottom:8px;left:0;right:0;text-align:center;color:#fff;font-size:15px;text-shadow:0 1px 3px #000}
  #camOverlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
       background:rgba(15,42,74,.92);color:#fff;text-align:center;padding:16px;font-size:18px}
  #camOverlay .big{font-size:22px;font-weight:700}

  #result{flex:1;overflow:auto;padding:14px 14px 8px}
  .card{background:var(--card);border-radius:18px;padding:16px 18px;box-shadow:0 2px 10px rgba(15,23,42,.08)}
  .card .name{font-size:24px;font-weight:700;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .card .price{display:flex;align-items:baseline;gap:8px;margin-top:6px}
  .card .price .v{font-size:clamp(52px,16vw,76px);font-weight:700;line-height:1.1;color:var(--navy)}
  .card .price .c{font-size:20px;color:var(--muted);font-weight:600}
  .card .noprice{margin-top:10px;font-size:22px;font-weight:700;color:var(--warn)}
  .card .meta{margin-top:8px;font-size:15px;color:var(--muted)}
  .card.notfound .head{font-size:26px;font-weight:700;color:var(--bad)}
  .card .actions{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
  .empty{color:var(--muted);text-align:center;font-size:17px;padding:22px 8px}

  nav{display:flex;gap:10px;padding:10px 14px calc(12px + env(safe-area-inset-bottom));background:#fff;border-top:1px solid var(--line)}
  .btn{flex:1;min-height:56px;border-radius:14px;border:0;font-size:18px;font-weight:700;background:var(--navy);color:#fff;
       display:flex;align-items:center;justify-content:center;gap:8px;padding:0 10px}
  .btn.light{background:#e8edf5;color:var(--navy)}
  .btn.on{background:#f59e0b;color:#111}
  .btn:active{transform:scale(.98)}

  /* sheets */
  .sheet{position:fixed;inset:0;background:rgba(15,23,42,.45);display:flex;align-items:flex-end;z-index:10}
  .sheet .panel{background:#fff;width:100%;border-radius:20px 20px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));max-height:88vh;display:flex;flex-direction:column;gap:10px}
  .sheet h2{margin:0;font-size:20px}
  .sheet input{width:100%;font-size:24px;padding:12px 14px;border:2px solid var(--line);border-radius:12px;font-family:inherit}
  .sheet input:focus{outline:none;border-color:var(--navy-2)}
  .row2{display:flex;gap:10px}
  #searchList{overflow:auto;flex:1;margin:0;padding:0;list-style:none}
  #searchList li{display:flex;align-items:center;gap:10px;padding:12px 4px;border-bottom:1px solid var(--line);font-size:17px}
  #searchList li .n{flex:1}
  #searchList li .p{font-weight:700;color:var(--navy)}
  #searchList li .p.z{color:var(--warn);font-weight:600;font-size:14px}
  #searchInfo{color:var(--muted);font-size:14px;min-height:20px}
</style>
</head>
<body>

<section id="setup" class="hidden">
  <img src="icons/icon-192.png" alt="">
  <h1>قارئ أسعار العون</h1>
  <p>اكتب كود المحل مرة وحدة على هالتلفون</p>
  <input id="codeInput" inputmode="numeric" autocomplete="off" placeholder="الكود">
  <button class="btn light" id="codeBtn">دخول</button>
  <button class="btn hidden" id="installBtn2" style="background:#16a34a">📲 ثبّت التطبيق على التلفون</button>
  <div id="setupMsg"></div>
</section>

<section id="app" class="hidden">
  <header>
    <div class="title">أسعار العون</div>
    <div class="status" id="status"></div>
    <button class="iconbtn hidden" id="installBtn" style="min-width:auto;padding:0 10px;font-size:15px;font-family:inherit">📲 تثبيت</button>
    <button class="iconbtn" id="refreshBtn" aria-label="تحديث الأسعار">⟳</button>
  </header>

  <div id="cam">
    <video id="video" playsinline muted></video>
    <div id="shade"><div id="win"></div></div>
    <div id="hint">وجّه الكاميرا نحو الباركود</div>
    <div id="camOverlay" class="hidden"></div>
  </div>

  <div id="result"><div class="empty">امسح باركود أي صنف لتظهر بياناته هون</div></div>

  <nav>
    <button class="btn light hidden" id="torchBtn">🔦 فلاش</button>
    <button class="btn light" id="manualBtn">⌨️ إدخال رقم</button>
    <button class="btn light" id="searchBtn">🔍 بحث بالاسم</button>
  </nav>
</section>

<div class="sheet hidden" id="manualSheet">
  <div class="panel">
    <h2>إدخال رقم الباركود أو الكود</h2>
    <input id="manualInput" inputmode="numeric" autocomplete="off" enterkeyhint="search">
    <div class="row2">
      <button class="btn" id="manualGo">اعرض السعر</button>
      <button class="btn light" data-close>إلغاء</button>
    </div>
  </div>
</div>

<div class="sheet hidden" id="searchSheet">
  <div class="panel">
    <div class="row2" style="align-items:center"><h2 style="flex:1">بحث بالاسم</h2><button class="btn light" style="flex:none;min-height:44px" data-close>إغلاق</button></div>
    <input id="searchInput" autocomplete="off" enterkeyhint="search" placeholder="اكتب جزء من اسم الصنف">
    <div id="searchInfo"></div>
    <ul id="searchList"></ul>
  </div>
</div>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
