<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>الصحي — العون</title>
<meta name="theme-color" content="#0e5c63">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="../fonts/cairo.css">
<style>
  :root{
    --navy:#0e5c63; --navy-2:#147a82; --ink:#0f172a; --muted:#5b6472; --line:#e3e7ee;
    --bg:#f3f5f9; --card:#ffffff; --ok:#16a34a; --warn:#b45309; --bad:#b91c1c;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{font-family:'Cairo',system-ui,sans-serif;background:var(--bg);color:var(--ink);
       -webkit-tap-highlight-color:transparent;overscroll-behavior:none}
  button{font-family:inherit}
  .num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
  .hidden{display:none!important}

  /* setup */
  #setup{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;gap:14px;
         background:var(--navy);color:#fff;text-align:center}
  #setup img{width:84px;height:84px;border-radius:18px}
  #setup h1{margin:0;font-size:26px}
  #setup p{margin:0;opacity:.85;font-size:16px}
  #setup input{width:min(320px,100%);font-size:28px;text-align:center;padding:12px;border-radius:12px;border:0;letter-spacing:4px;font-family:inherit}
  #setup .btn{width:min(320px,100%);flex:none}
  #setupMsg{min-height:24px;color:#fecaca;font-weight:600}

  /* app */
  #app{height:100%;display:flex;flex-direction:column}
  header{background:var(--navy);color:#fff;padding:8px 14px calc(8px) 14px;display:flex;align-items:center;gap:10px;
         padding-top:calc(8px + env(safe-area-inset-top))}
  header .title{font-weight:700;font-size:18px;flex:1;white-space:nowrap}
  header .status{font-size:12px;opacity:.85;text-align:left;line-height:1.3}
  header .status.warn{color:#fde68a;opacity:1}
  .iconbtn{background:transparent;border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:10px;min-width:44px;height:40px;font-size:18px}

  #cam{position:relative;background:#000;height:30vh;min-height:220px;overflow:hidden;flex:none}
  #cam video{width:100%;height:100%;object-fit:cover;display:block}
  #shade{position:absolute;inset:0;pointer-events:none}
  #win{position:absolute;left:6%;right:6%;top:31%;bottom:31%;border:3px solid rgba(255,255,255,.9);border-radius:12px;
       box-shadow:0 0 0 2000px rgba(0,0,0,.45);transition:border-color .15s}
  #win::after{content:"";position:absolute;left:4%;right:4%;top:50%;height:2px;background:rgba(239,68,68,.85)}
  #win.hit{border-color:#22c55e}
  #win.hit::before{content:"✓";position:absolute;top:-34px;left:50%;transform:translateX(-50%);background:#16a34a;color:#fff;
       border-radius:999px;width:30px;height:30px;display:flex;align-items:center;justify-content:center;font-weight:700}
  #hint{position:absolute;bottom:8px;left:0;right:0;text-align:center;color:#fff;font-size:15px;text-shadow:0 1px 3px #000}
  #camOverlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
       background:rgba(14,92,99,.94);color:#fff;text-align:center;padding:16px;font-size:18px}
  #camOverlay .big{font-size:22px;font-weight:700}

  #result{flex:1;overflow:auto;padding:14px 14px 8px}
  .card{background:var(--card);border-radius:18px;padding:16px 18px;box-shadow:0 2px 10px rgba(15,23,42,.08)}
  .card .name{font-size:24px;font-weight:700;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .card .price{display:flex;align-items:baseline;gap:8px;margin-top:6px}
  .card .price .v{font-size:clamp(52px,16vw,76px);font-weight:700;line-height:1.1;color:var(--navy)}
  .card .price .c{font-size:20px;color:var(--muted);font-weight:600}
  .card .noprice{margin-top:10px;font-size:22px;font-weight:700;color:var(--warn)}
  .card .meta{margin-top:8px;font-size:15px;color:var(--muted)}
  .card.notfound .head{font-size:26px;font-weight:700;color:var(--bad)}
  .card .actions{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
  .empty{color:var(--muted);text-align:center;font-size:17px;padding:22px 8px}

  nav{display:flex;gap:10px;padding:10px 14px calc(12px + env(safe-area-inset-bottom));background:#fff;border-top:1px solid var(--line)}
  .btn{flex:1;min-height:56px;border-radius:14px;border:0;font-size:18px;font-weight:700;background:var(--navy);color:#fff;
       display:flex;align-items:center;justify-content:center;gap:8px;padding:0 10px}
  .btn.light{background:#e8edf5;color:var(--navy)}
  .btn.on{background:#f59e0b;color:#111}
  .btn:active{transform:scale(.98)}

  /* sheets */
  .sheet{position:fixed;inset:0;background:rgba(15,23,42,.45);display:flex;align-items:flex-end;z-index:10}
  .sheet .panel{background:#fff;width:100%;border-radius:20px 20px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));max-height:88vh;display:flex;flex-direction:column;gap:10px}
  .sheet h2{margin:0;font-size:20px}
  .sheet input{width:100%;font-size:24px;padding:12px 14px;border:2px solid var(--line);border-radius:12px;font-family:inherit}
  .sheet input:focus{outline:none;border-color:var(--navy-2)}
  .row2{display:flex;gap:10px}
  #searchList{overflow:auto;flex:1;margin:0;padding:0;list-style:none}
  #searchList li{display:flex;align-items:center;gap:10px;padding:12px 4px;border-bottom:1px solid var(--line);font-size:17px}
  #searchList li .n{flex:1}
  #searchList li .p{font-weight:700;color:var(--navy)}
  #searchList li .p.z{color:var(--warn);font-weight:600;font-size:14px}
  #searchInfo{color:var(--muted);font-size:14px;min-height:20px}

  /* تفاصيل التكلفة */
  .src{display:inline-block;margin-bottom:6px;font-size:13px;font-weight:700;color:var(--navy);background:#e3f1f2;border-radius:999px;padding:2px 10px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
  .cell{background:#f3f7f8;border-radius:12px;padding:8px 12px}
  .cell .l{font-size:13px;color:var(--muted)}
  .cell .x{font-size:20px;font-weight:700}
  .cell.cost .x{color:#7c2d12}
  .cell.wide{grid-column:1 / -1}
  .profit{margin-top:10px;border-radius:12px;padding:10px 12px;font-size:18px;font-weight:700;background:#dcfce7;color:#166534}
  .profit.low{background:#fef3c7;color:#92400e}
  .profit.loss{background:#fee2e2;color:#991b1b}
  .chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
  .chip{flex:none;border:2px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px;font-size:15px;font-weight:700;font-family:inherit;color:var(--ink)}
  .chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
  #searchList li.sec{background:#f3f7f8;font-weight:700;color:var(--navy);font-size:15px;padding:8px 6px;border-bottom:0}
  #searchList li .m{font-size:12px;font-weight:700;border-radius:999px;padding:1px 8px}
  #searchList li .m.low{background:#fef3c7;color:#92400e}
  #searchList li .m.loss{background:#fee2e2;color:#991b1b}
  /* شاشة كبيرة (ويندوز / تابلت) */
  @media (min-width:900px){
    #app{max-width:1100px;margin:0 auto;display:grid;grid-template-columns:420px 1fr;grid-template-rows:auto 1fr auto;height:100%}
    header{grid-column:1 / -1}
    #cam{height:auto;min-height:0}
    nav{grid-column:1 / -1}
    .sheet .panel{max-width:760px;margin:0 auto;border-radius:20px 20px 0 0}
  }

  /* الصحي 2: موردين ومقارنة وطلبية */
  .badge{background:#dc2626;color:#fff;border-radius:999px;font-size:13px;padding:0 7px;min-width:22px;line-height:22px}
  nav .btn{font-size:15px;padding:0 6px}
  #quoteBar{background:#fef3c7;color:#78350f;padding:8px 14px;display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px}
  #quoteBar .x{flex:1}
  #quoteBar button{border:0;background:#78350f;color:#fff;border-radius:10px;padding:6px 12px;font-family:inherit;font-weight:700}
  .sups{margin-top:12px;border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .sups .row{display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid var(--line);font-size:16px}
  .sups .row:last-child{border-bottom:0}
  .sups .row .s{flex:1;font-weight:700}
  .sups .row .d{font-size:12px;color:var(--muted)}
  .sups .row .v{font-weight:700;min-width:70px;text-align:left}
  .sups .row.best{background:#dcfce7}
  .sups .head{background:#f3f7f8;font-size:13px;color:var(--muted);font-weight:700}
  .lowever{margin-top:8px;font-size:14px;color:#166534;font-weight:700}
  .newp{margin-top:14px;background:#f8fafc;border:2px dashed #cbd5e1;border-radius:14px;padding:12px}
  .newp h3{margin:0 0 8px;font-size:17px}
  .f{display:flex;gap:8px;flex-wrap:wrap}
  .f label{flex:1 1 140px;display:flex;flex-direction:column;gap:3px;font-size:13px;color:var(--muted);font-weight:700}
  .f input,.f select{font-size:20px;padding:9px 10px;border:2px solid var(--line);border-radius:10px;font-family:inherit;width:100%;background:#fff;color:var(--ink)}
  .f input:focus{outline:none;border-color:var(--navy-2)}
  .cmp{margin-top:8px;font-weight:700;font-size:16px;min-height:22px}
  .cmp.good{color:#166534}.cmp.bad{color:#b91c1c}.cmp.same{color:var(--muted)}
  .btn.ok{background:#16a34a}
  .grp{border:1px solid var(--line);border-radius:14px;margin-bottom:12px;overflow:hidden}
  .grp .gh{background:#e3f1f2;padding:8px 12px;font-weight:700;display:flex;align-items:center;gap:8px}
  .grp .gh .t{flex:1}
  .ln{display:flex;align-items:center;gap:6px;padding:8px 10px;border-top:1px solid var(--line);font-size:15px}
  .ln .n{flex:1}
  .ln input{width:64px;font-size:17px;padding:5px;border:2px solid var(--line);border-radius:8px;text-align:center;font-family:inherit}
  .ln select{max-width:120px;font-size:14px;padding:4px;border:1px solid var(--line);border-radius:8px;font-family:inherit}
  .ln .x{border:0;background:none;font-size:18px;color:#b91c1c}
  .gf{display:flex;gap:8px;padding:8px 10px;border-top:1px solid var(--line);align-items:center}
  .gf .tot{flex:1;font-weight:700}
  .menu button{width:100%;margin-bottom:8px}
  .plist{list-style:none;margin:0;padding:0;overflow:auto}
  .plist li{display:flex;gap:10px;align-items:center;padding:10px 4px;border-bottom:1px solid var(--line);font-size:16px}
  .plist .n{flex:1;font-weight:700}
  .btn.on{background:#f59e0b;color:#111}
</style>
</head>
<body>

<section id="setup" class="hidden">
  <img src="icons/icon-192.png" alt="">
  <h1>محلات العون لمواد البناء</h1>
  <p style="font-size:20px;font-weight:700;opacity:1">الصحي — التكلفة والربح</p>
  <p>اكتب كود الصحي مرة وحدة على هالجهاز</p>
  <input id="codeInput" inputmode="numeric" autocomplete="off" placeholder="الكود">
  <button class="btn light" id="codeBtn">دخول</button>
  <button class="btn hidden" id="installBtn2" style="background:#16a34a">📲 ثبّت التطبيق على التلفون</button>
  <div id="setupMsg"></div>
</section>

<section id="app" class="hidden">
  <header>
    <div class="title">الصحي</div>
    <div class="status" id="status"></div>
    <button class="iconbtn hidden" id="installBtn" style="min-width:auto;padding:0 10px;font-size:15px;font-family:inherit">📲 تثبيت</button>
    <button class="iconbtn" id="refreshBtn" aria-label="تحديث الأسعار">⟳</button>
  </header>

  <div id="quoteBar" class="hidden"></div>

  <div id="cam">
    <video id="video" playsinline muted></video>
    <div id="shade"><div id="win"></div></div>
    <div id="hint">وجّه الكاميرا نحو الباركود</div>
    <div id="camOverlay" class="hidden"></div>
  </div>

  <div id="result"><div class="empty">امسح باركود صنف أو ابحث عنه — بيطلعلك كل الموردين وأقل سعر حصلته</div></div>

  <nav>
    <button class="btn light hidden" id="torchBtn">🔦</button>
    <button class="btn light" id="searchBtn">🔍 بحث</button>
    <button class="btn light" id="quoteBtn">📝 عرض مورد</button>
    <button class="btn light" id="cartBtn">🛒 الطلبية <span id="cartN" class="badge hidden">0</span></button>
    <button class="btn light" id="moreBtn" style="flex:none;min-width:56px">➕</button>
  </nav>
</section>

<div class="sheet hidden" id="manualSheet">
  <div class="panel">
    <h2>إدخال رقم الباركود أو الكود</h2>
    <input id="manualInput" inputmode="numeric" autocomplete="off" enterkeyhint="search">
    <div class="row2">
      <button class="btn" id="manualGo">اعرض السعر</button>
      <button class="btn light" data-close>إلغاء</button>
    </div>
  </div>
</div>

<div class="sheet hidden" id="searchSheet">
  <div class="panel">
    <div class="row2" style="align-items:center"><h2 style="flex:1">تصفّح وبحث</h2><button class="btn light" style="flex:none;min-height:44px" data-close>إغلاق</button></div>
    <input id="searchInput" autocomplete="off" enterkeyhint="search" placeholder="اكتب جزء من اسم الصنف">
    <div id="chips" class="chips"></div>
    <div id="searchInfo"></div>
    <ul id="searchList"></ul>
  </div>
</div>

<div class="sheet hidden" id="formSheet">
  <div class="panel" id="formPanel"></div>
</div>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
